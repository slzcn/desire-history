<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="欲望简史——12道题测出你灵魂深处的欲望原型">
<title>欲望简史</title>
<style>
:root{
  --bg:#0d0a06; --bg2:#14100a; --gold:#c9a84c; --gold-dim:#8a7330;
  --gold-light:#e8d49a; --cream:#e8e0d0; --cream-dim:#a8a098;
  --card:rgba(201,168,76,0.08); --card-hover:rgba(201,168,76,0.16);
  --border:rgba(201,168,76,0.25); --border-hover:rgba(201,168,76,0.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--cream);
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse at 50% 20%,rgba(201,168,76,0.06) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 80%,rgba(201,168,76,0.03) 0%,transparent 50%);
  pointer-events:none;z-index:0;
}
#app{width:100%;max-width:560px;padding:0 20px;position:relative;z-index:1;flex:1;display:flex;flex-direction:column}
.hidden{display:none!important}

/* 封面 */
#cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;min-height:100vh;padding-bottom:60px}
#cover h1{
  font-size:2.8rem;color:var(--gold);letter-spacing:0.3em;font-weight:normal;
  margin-bottom:8px;text-shadow:0 0 20px rgba(201,168,76,0.2);
}
#cover .subtitle{font-size:0.9rem;color:var(--cream-dim);letter-spacing:0.4em;margin-bottom:40px}
#cover .intro{font-size:0.95rem;color:var(--cream);line-height:2;margin-bottom:48px;max-width:380px;opacity:0.85}
#cover .ornament{color:var(--gold-dim);font-size:1.2rem;margin-bottom:40px;letter-spacing:1em;padding-left:1em}
.start-btn{
  display:inline-block;padding:14px 48px;font-size:1rem;color:var(--gold);
  border:1px solid var(--gold-dim);border-radius:2px;background:transparent;
  font-family:inherit;letter-spacing:0.3em;cursor:pointer;transition:all 0.4s;
}
.start-btn:hover,.start-btn:active{background:var(--card-hover);border-color:var(--gold);box-shadow:0 0 20px rgba(201,168,76,0.15)}

/* 进度条 */
.progress-wrap{padding:24px 0 8px}
.progress-bar{height:3px;background:rgba(201,168,76,0.12);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:2px;transition:width 0.5s ease;width:0%}
.progress-text{font-size:0.75rem;color:var(--cream-dim);letter-spacing:0.1em;margin-top:8px;text-align:center}

/* 题目 */
#quiz{display:flex;flex-direction:column;flex:1;padding-top:20px}
.question-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;animation:fadeIn 0.5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.question-text{font-size:1.15rem;color:var(--gold-light);line-height:2;margin-bottom:32px;text-align:center}
.options{display:flex;flex-direction:column;gap:12px}
.option{
  padding:16px 20px;background:var(--card);border:1px solid var(--border);
  border-radius:4px;color:var(--cream);font-size:0.95rem;line-height:1.7;
  cursor:pointer;transition:all 0.25s;font-family:inherit;text-align:left;
}
.option:hover,.option:active{background:var(--card-hover);border-color:var(--border-hover);color:var(--gold-light)}
.option .opt-label{color:var(--gold);margin-right:8px;font-weight:bold}

/* 结果页 */
#result{display:flex;flex-direction:column;align-items:center;flex:1;padding:30px 0 60px;animation:fadeIn 0.6s ease}
.result-emoji{font-size:3.5rem;margin-bottom:12px}
.result-type{font-size:2rem;color:var(--gold);letter-spacing:0.2em;margin-bottom:6px}
.result-figure{font-size:0.85rem;color:var(--cream-dim);letter-spacing:0.15em;margin-bottom:24px}
.result-desc{font-size:0.95rem;color:var(--cream);line-height:2;text-align:center;max-width:420px;margin-bottom:24px}
.result-divider{width:60px;height:1px;background:var(--gold-dim);margin:8px 0 24px}
.combo-title{font-size:0.8rem;color:var(--gold-dim);letter-spacing:0.3em;margin-bottom:12px}
.combo-text{font-size:0.9rem;color:var(--cream);line-height:1.9;text-align:center;max-width:420px;margin-bottom:30px;opacity:0.85}
.score-chart{width:100%;max-width:360px;margin-bottom:32px}
.score-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.score-name{font-size:0.75rem;color:var(--cream-dim);width:56px;text-align:right;flex-shrink:0}
.score-bar-bg{flex:1;height:6px;background:rgba(201,168,76,0.08);border-radius:3px;overflow:hidden}
.score-bar-fill{height:100%;background:var(--gold-dim);border-radius:3px;transition:width 0.8s ease}
.score-val{font-size:0.7rem;color:var(--cream-dim);width:20px;flex-shrink:0}
.share-section{width:100%;max-width:420px}
.share-btn{
  display:block;width:100%;padding:12px;font-size:0.85rem;color:var(--gold);
  border:1px solid var(--gold-dim);border-radius:3px;background:transparent;
  font-family:inherit;letter-spacing:0.15em;cursor:pointer;transition:all 0.3s;margin-bottom:12px;
}
.share-btn:hover,.share-btn:active{background:var(--card-hover);border-color:var(--gold)}
.share-text-box{
  font-size:0.8rem;color:var(--cream);line-height:1.8;background:var(--card);
  border:1px solid var(--border);border-radius:3px;padding:14px;
  white-space:pre-wrap;word-break:break-all;display:none;
}
.restart-btn{margin-top:20px;font-size:0.8rem;color:var(--cream-dim);background:none;border:none;font-family:inherit;cursor:pointer;text-decoration:underline;letter-spacing:0.1em}
.restart-btn:active{color:var(--gold)}
.copied-tip{font-size:0.75rem;color:var(--gold);text-align:center;margin-top:8px;opacity:0;transition:opacity 0.3s}
.copied-tip.show{opacity:1}
</style>
</head>

<div id="cover">

     {t:'一个月太久了，那边安不安全、吃什么、住哪',s:{2:1}},

     {t:'那边有认识的人吗，能不能约到见面',s:{6:1}},
     {t:'去一个最远、最陌生的地方',s:{3:1,7:1}}
   ]},
  {q:'跟一个刚认识的人聊到深夜，对方突然问：「你这辈子最想要什么？」你沉默了几秒。那几秒里你真正在想的不是答案，而是——',
   opts:[
     {t:'他为什么问这个，想从我这得到什么',s:{0:1}},
     {t:'说哪个答案会让他觉得我更有意思',s:{1:1}},
     {t:'这个问题我以前想过，但每次答案都不一样',s:{4:1}},
     {t:'我到底想要什么？我真的知道吗',s:{7:1}}
   ]},
  {q:'面前四扇一模一样的门，每扇后面是你这辈子最渴望的东西，但只能进一次，不能回头。你推门之前先问了——',
   opts:[
     {t:'「进去之后还能出来吗？」',s:{2:1}},
     {t:'「有没有人跟我一起进去？」',s:{6:1}},
     {t:'「四扇门后面分别是什么？」',s:{4:1}},
     {t:'什么都没问，推开最近的那扇',s:{3:1}}
   ]},
  {q:'整理旧物翻到一张十年前的照片，你盯着看了很久。让你停下手的不是照片本身，而是——',
   opts:[
     {t:'那时候刚学会的、后来再也没碰过的手艺',s:{5:1}},
     {t:'那时候的我比现在好看多了还是差多了',s:{1:1}},
     {t:'十年了，我到底变成了谁',s:{7:1}},
     {t:'要是那时候走了另一条路，现在会怎样',s:{3:1}}
   ]},
  {q:'你老了，坐在椅子上回顾一生，说了句「值了」。让你说出这句话的那一刻，你在想的是——',
   opts:[
     {t:'我做到了别人没做到的事',s:{7:1}},
     {t:'我留下了一些不会消失的东西',s:{5:1}},
     {t:'一辈子都在我掌控之中，没出过大乱子',s:{0:1,2:1}},
     {t:'我身边的人，一个都没走散',s:{6:1}}
   ]}
];

let currentQ = 0;
let scores = [0,0,0,0,0,0,0,0];
let answers = [];

function startQuiz(){
  currentQ = 0;
  scores = [0,0,0,0,0,0,0,0];
  answers = [];
  document.getElementById('cover').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion(){
  const q = questions[currentQ];
  const wrap = document.getElementById('questionWrap');
  const labels = ['A','B','C','D'];
  let html = '<div class="question-text">'+q.q+'</div><div class="options">';
  for(let i=0;i<q.opts.length;i++){
    html += '<div class="option" onclick="selectOption('+i+')"><span class="opt-label">'+labels[i]+'.</span>'+q.opts[i].t+'</div>';
  }
  html += '</div>';
  wrap.innerHTML = html;
  wrap.style.animation = 'none';
  void wrap.offsetWidth;
  wrap.style.animation = '';
  // progress
  const pct = ((currentQ)/questions.length*100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressText').textContent = '第 '+(currentQ+1)+' 题 / 共 '+questions.length+' 题';
  window.scrollTo(0,0);
}

function selectOption(i){
  const q = questions[currentQ];
  const opt = q.opts[i];
  for(let k in opt.s){
    scores[parseInt(k)] += opt.s[k];
  }
  answers.push(i);
  currentQ++;
  if(currentQ >= questions.length){
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult(){
  // find top 2
  let ranked = scores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v || a.i-b.i);
  const top1 = ranked[0].i;
  const top2 = ranked[1].i;
  const t1 = types[top1];
  const t2 = types[top2];

  // combo key
  const minI = Math.min(top1,top2), maxI = Math.max(top1,top2);
  const comboKey = minI+'_'+maxI;
  const combo = comboReadings[comboKey] || ('你的欲望在 '+t1.name+' 与 '+t2.name+' 之间共振——前者是你显性的渴求，后者是你暗涌的底色。');

  // progress full
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = '测试完成';

  // share text
  const shareText = '【欲望简史】我的欲望原型是「'+t1.name+'」——'+t1.desc.slice(0,30)+'…\n\n代表人物：'+t1.figure+' '+t1.emoji+'\n次要原型：'+t2.name+'\n\n你的欲望是什么？来测测：https://slzcn.github.io/desire-history/';

  // score chart
  let chartHtml = '<div class="score-chart">';
  let maxScore = Math.max(...scores, 1);
  for(let i=0;i<8;i++){
    const t = types[i];
    const w = (scores[i]/maxScore*100);
    chartHtml += '<div class="score-row">'+
      '<span class="score-name">'+t.name+'</span>'+
      '<div class="score-bar-bg"><div class="score-bar-fill" style="width:'+w+'%"></div></div>'+
      '<span class="score-val">'+scores[i]+'</span></div>';
  }
  chartHtml += '</div>';

  const html = `
    <div class="result-emoji">${t1.emoji}</div>
    <div class="result-type">${t1.name}</div>
    <div class="result-figure">代表人物 · ${t1.figure}</div>
    <div class="result-desc">${t1.desc}</div>
    <div class="result-divider"></div>
    <div class="combo-title">双原型共振</div>
    <div class="combo-text">${combo}</div>
    ${chartHtml}
    <div class="share-section">
      <button class="share-btn" onclick="copyShare()">复制分享文案</button>
      <div class="share-text-box" id="shareBox">${shareText.replace(/</g,'&lt;')}</div>
      <div class="copied-tip" id="copiedTip">已复制到剪贴板</div>
      <button class="restart-btn" onclick="startQuiz()">重新测试</button>
    </div>
  `;
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('result').innerHTML = html;
  window.scrollTo(0,0);

  // animate bars
  setTimeout(()=>{
    document.querySelectorAll('.score-bar-fill').forEach(el=>{
      const w = el.style.width;
      el.style.width = '0%';
      setTimeout(()=>{el.style.width=w;},50);
    });
  },100);
}

function copyShare(){
  const box = document.getElementById('shareBox');
  const text = box.innerText;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>{
      showCopied();
    }).catch(()=>{
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  showCopied();
}

function showCopied(){
  const tip = document.getElementById('copiedTip');
  tip.classList.add('show');
  setTimeout(()=>{tip.classList.remove('show');},2000);
}
</script>
